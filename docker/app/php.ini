; 公開用の app の PHP の設定(docs の 設計/公開の配備/構成.md 3.6)。土台は php.ini-production で、この値で上書きする
; (Dockerfile が /usr/local/etc/php/conf.d/ に置く。CLI(artisan)にも掛かる)。

; 1 要求の上限。memory_limit × max_threads(docker/app/Caddyfile の 4)+ 常駐分(仮に 128MB)≤ app のメモリの上限(512MB)
; = 96MB × 4 + 128MB = 512MB。常駐分は実機検証で docker stats で測り、外れたら値を直す
; queue は同じイメージなので、compose.publish.yml の起動のコマンド(php -d memory_limit=…)で上書きする
; (scheduler は子のプロセスに -d が効かないので、この値のまま)
memory_limit = 96M

; 1 ファイルの上限は config/uploads.php の既定 max_file_bytes と同じ値(docs の 設計/業務データの入れ物/レコードの共通機能/添付ファイル/README.md の 3 節)
upload_max_filesize = 95M
; 要求の本文の上限 = 1 回の合計の上限 + 値の上限 4MiB + 余白 2MiB(docs の 設計/ワークフロー/申請の周辺/添付/README.md の 4 節)
; = config/uploads.php の既定 max_request_bytes 95MiB + 4MiB + 2MiB = 101MiB
post_max_size = 101M

; X-Powered-By で PHP の版を出さない
expose_php = Off

; コードはイメージの中で変わらないので、ファイルの更新を確かめない
opcache.enable = 1
opcache.validate_timestamps = 0

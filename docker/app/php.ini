; 公開用の app の PHP の設定(docs の 設計/公開の配備/構成.md 3.6)。土台は php.ini-production で、この値で上書きする
; (Dockerfile が /usr/local/etc/php/conf.d/ に置く。CLI(artisan)にも掛かる)。

; 1 要求の上限。memory_limit × max_threads(docker/app/Caddyfile の 4)+ 常駐分(仮に 128MB)≤ app のメモリの上限(512MB)
; = 96MB × 4 + 128MB = 512MB。常駐分は実機検証で docker stats で測り、外れたら値を直す
memory_limit = 96M

; 1 回のアップロードは 2MB まで(公開デモの運用方針)。要求の本文は 8MB まで
upload_max_filesize = 2M
post_max_size = 8M

; X-Powered-By で PHP の版を出さない
expose_php = Off

; コードはイメージの中で変わらないので、ファイルの更新を確かめない
opcache.enable = 1
opcache.validate_timestamps = 0

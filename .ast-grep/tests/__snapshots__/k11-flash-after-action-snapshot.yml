    <?php
    final class RuleController
    {
        public function store($request, string $module)
        {
            if ($request->boolean('notify')) {
                Inertia::flash('toast', ['type' => 'success', 'message' => '追加しました']);
            }
            $this->addRule->execute($module, $request->ruleInput());
            return redirect()->route('records.admin.modules.show', ['module' => $module], 303);
        }
    }

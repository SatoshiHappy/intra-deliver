        <?php
        return Inertia::render('Records.Admin.ModuleCreate');
    - |
        <?php
        return Inertia::render('Records.Admin.FieldForm', []);
    - |
        <?php
        return Inertia::render('Index', []);
    - |
        <?php
        return Inertia::render('records/Index', []);

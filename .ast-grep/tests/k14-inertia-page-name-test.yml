id: k14-inertia-page-name
valid:
    - |
        <?php
        return Inertia::render('Records/Admin/FieldForm', ['module' => $module]);
    - |
        <?php
        Route::inertia('/', 'Menu/Home')->name('menu.home');
    - |
        <?php
        return Inertia::render($page, []);
    - |
        <?php
        return Inertia::render('Records/Admin/ModuleCreate');
    - |
        <?php
        return Inertia::render('Records/' . $name, []);
